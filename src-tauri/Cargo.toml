[package]
name = "relay-desk-local"
version = "1.1.0"
description = "Relay Desk local-first model detector"
edition = "2021"
rust-version = "1.89"

[lib]
name = "relay_desk_local"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSValue", "NSError"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
