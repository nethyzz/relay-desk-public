name: Validate release source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r runner/requirements.txt
      - name: Download and verify pinned original engine and benchmarks
        run: python scripts/bootstrap_upstream.py
      - name: TypeScript behavior tests
        run: npm test
      - name: Python adapter and original-engine parity tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Typecheck and production build
        run: npm run build
      - name: Original Python and WASM app parity
        run: npm run app:verify
      - name: Build native app frontend
        run: node scripts/app.mjs web
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend
          path: native-dist/
          retention-days: 3

  native-tests:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.app-build/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend
          path: native-dist/
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS native persistence and file-protection tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
